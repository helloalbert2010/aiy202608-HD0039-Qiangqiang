<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf1ec" />
    <title>事件星球 · MyArchive</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="atlas">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <header class="topbar" id="topbar"></header>
        <main class="atlas-main">
          <header class="atlas-header">
            <div class="atlas-title-block">
              <div class="eyebrow">MEMORY CONSTELLATION</div>
              <h1>事件星球</h1>
              <p>林墨的成长轨迹 · 持续生成中</p>
            </div>
            <div class="atlas-header-tools">
              <div class="atlas-metrics" aria-live="polite">
                <div><strong id="atlas-record-count">0</strong><span>事件</span></div>
                <div><strong id="atlas-edge-count">0</strong><span>连接</span></div>
              </div>
              <div class="atlas-controls" aria-label="视图控制">
                <button class="atlas-icon-button" id="atlas-rotation-toggle" type="button" title="暂停自动旋转" aria-label="暂停自动旋转" aria-pressed="true">Ⅱ</button>
                <button class="atlas-icon-button" id="atlas-reset" type="button" title="重置视角" aria-label="重置视角">↺</button>
              </div>
            </div>
          </header>
          <section class="atlas-stage" id="atlas-stage" aria-label="事件关系三维图">
            <div class="atlas-loading" id="atlas-loading">正在生成关系图…</div>
            <div class="atlas-focus" id="atlas-focus" aria-live="polite" hidden>
              <span></span><strong></strong><small></small>
            </div>
            <div class="atlas-empty" id="atlas-empty" hidden>
              <div class="atlas-empty-mark">◎</div>
              <h2>星球还没有顶点</h2>
              <p>保存第一段经历后，它会出现在这里。</p>
              <a class="btn btn-primary" href="/record">记录新经历</a>
            </div>
            <nav class="sr-only" id="atlas-record-links" aria-label="事件星球记录列表"></nav>
          </section>
        </main>
      </div>
    </div>
    <div id="global-modals"></div><div class="toast" id="toast"></div>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/memory-atlas.js"></script>
  </body>
</html>
