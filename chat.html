<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>与 AI 对话 · MyArchive</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="chat">
    <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header><main class="chat-main">
      <section class="chat-workspace" id="chat-workspace">
        <button class="chat-clear" id="clear-chat" type="button"><i data-lucide="rotate-ccw"></i><span>清空对话</span></button>
        <div class="chat-intro" id="chat-intro">
          <div class="chat-intro-mark" aria-hidden="true"><span class="brand-mark"></span></div>
          <h1>与 AI 开始对话</h1>
          <p>可以先聊聊最近的想法；当你需要回顾、筛选或改写经历时，我会再调用经历库与随手记。</p>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="chat-input" id="chat-form">
          <div class="chat-composer-copy">
            <div class="chat-references" id="chat-references" aria-label="正在追问的事件" hidden></div>
            <textarea id="chat-input" rows="1" maxlength="4000" placeholder="和我聊聊，或告诉我你想找什么" aria-label="对话内容"></textarea>
          </div>
          <span class="sr-only" id="chat-voice-status" aria-live="polite"></span>
          <button class="chat-voice" id="chat-voice" type="button" title="语音输入" aria-label="语音输入" aria-pressed="false"><i data-lucide="mic"></i></button>
          <button class="send-btn" type="submit" title="发送" aria-label="发送"><i data-lucide="arrow-up"></i></button>
        </form>
      </section>
    </main></div></div>
    <div id="global-modals"></div><div class="toast" id="toast"></div><script type="module" src="/app.js"></script>
  </body>
</html>
